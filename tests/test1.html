<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 1</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <label  be-typed><span>[Specify Name]</span></label>
    <div id=target></div>

    <be-hive>
        <script type=emc src="be-typed/emc.json"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
    <script>
        function runScript(){
            document.querySelector('.be-typed-trigger').click();
            setTimeout(() => {
                target.setAttribute('mark', 'good');
            }, 100);
        }
        setTimeout(() => {
            runScript();
        }, 600);
    </script>
</body>
</html>
